 skin:'#E8B98F',skin2:'#C98F67',coat:'#5B7553',coat2:'#465C40',cap:'#6B4F3A',pants:'#4A4A5A',shoe:'#2E2622',scarf:'#B0453A',cat:'#D9822B',cat2:'#A85F17',

let PH=window.PH_OVERRIDE||[ // [inicio, fin, texto] — tiempos provisionales; se sustituyen por los de la voz
[0.5,4.6,"Un hombre vive en un *décimo... pero cada tarde sube en ascensor solo hasta el *séptimo."],[4.9,5.6,"¿Por *qué?"],
[6.0,7.2,"Un *acertijo al día."],[7.5,10.6,"Se llama *Andrés. Vive solo, con su gato, *Bigotes."],[10.9,13.2,"Por la mañana, baja en ascensor hasta la *calle."],
[13.5,16.9,"Al volver, se baja en el *siete... y sube *tres pisos a pie."],[17.2,20.6,"Pero ojo: los días de *lluvia, sube en ascensor hasta el *diez."],[20.9,22.6,"Tienes diez segundos. *Piensa."],
[33.0,36.0,"Tiempo. Fíjate en el panel: el *diez es el botón más *alto."],[36.3,40.2,"Y aquí viene la clave: Andrés es muy *bajito. Solo llega hasta el *siete."],
[40.5,44.6,"¿Y cuando llueve? Lleva *paraguas... y con la punta pulsa el *diez."],[44.9,49.4,"Caso *cerrado. ¿Lo habías *pillado? Cuéntame en comentarios si lo *acertaste."],
[49.7,55.5,"Y la próxima vez que veas un *paraguas en un ascensor... ya sabes *por qué. Síguenos para el próximo *expediente."]];
const CD=window.CD_OVERRIDE||[22.8,32.8]; // cuenta atrás (10 s)

/* ===== utilidades ===== */
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const lerp=(a,b,x)=>a+(b-a)*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;const eoc=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pr=(t,a,b)=>cl((t-a)/(b-a));const pop=(t,a,d=.5)=>{const x=(t-a)/d;return x<=0?0:x>=1?1:eob(x)};
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const q2=t=>Math.floor(t*12)/12;
const O=`stroke="${N.ink}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
const tr=(x,y,s=1,r=0)=>`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${(+s).toFixed(4)})`;
function camAt(keys,t){if(t<=keys[0][0])return keys[0].slice(1);for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<=b[0]){const x=eio((t-a[0])/(b[0]-a[0]));return [1,2,3].map(j=>lerp(a[j],b[j],x))}}return keys[keys.length-1].slice(1)}
const CAM=(c,inner,d=1)=>`<g transform="translate(540,860) scale(${Math.pow(c[2],d).toFixed(4)}) translate(${(-c[0]*d-540*(1-d)).toFixed(1)},${(-c[1]*d-860*(1-d)).toFixed(1)})">${inner}</g>`;
const ph=i=>PH[i][0];

/* ===== texturas y luz ===== */
const DEFS=`<defs>

<filter id="woodT" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .14  0 0 0 0 .07  0 0 0 .45 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>

<linearGradient id="brassG" x1="0" x2="1"><stop offset="0" stop-color="${N.brass2}"/><stop offset=".45" stop-color="#E9CB61"/><stop offset="1" stop-color="${N.brass2}"/></linearGradient>
<radialGradient id="btnG" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".6" stop-color="#E7D7AA"/><stop offset="1" stop-color="#B39E66"/></radialGradient>
<radialGradient id="btnOn" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF9D0"/><stop offset=".5" stop-color="#FFC94A"/><stop offset="1" stop-color="#D98E10"/></radialGradient>
<linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${N.sky1}"/><stop offset=".55" stop-color="${N.sky2}"/><stop offset="1" stop-color="${N.sky3}"/></linearGradient>
<linearGradient id="skyRain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2738"/><stop offset="1" stop-color="#4C5A72"/></linearGradient>
<linearGradient id="skyMorning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC3E0"/><stop offset="1" stop-color="#F6DDB0"/></linearGradient>
<radialGradient id="lamp" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
</defs>`;
function paperRect(x,y,w,h,rx=8,fill=N.paper){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" filter="url(#paperT)"/>`}
function woodRect(x,y,w,h,extra=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#woodG)" ${extra}/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000" filter="url(#woodT)" opacity=".9"/>`}
